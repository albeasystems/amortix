# Deploys the site to GitHub Pages at https://albeasystems.github.io/amortix/.
# The site lives in web/; Pages > Source must be set to "GitHub Actions" in albeasystems/amortix.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test            # engine figures against the iOS app, translation parity, copy rules
      - run: npm run build
      - run: node scripts/audit.mjs   # titles, one h1, canonicals, hreflang, JSON-LD, links, images, sitemap
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
